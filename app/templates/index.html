<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Patient Management System</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>🩺 AI Patient Management System</h1>

    <!-- Profile Header -->
    <div class="card dashboard-header">

        <div>
            <h2 id="welcome-user">
                Welcome User 👋
            </h2>

            <p>
                AI Powered Healthcare Dashboard
            </p>
        </div>

        <button onclick="logout()">
            Logout
        </button>

    </div>

    <!-- Stats Cards -->

    <div class="stats-grid">

        <div class="card stat-card">
            <h3>📊 Total Predictions</h3>
            <h2 id="total-predictions">0</h2>
        </div>

        <div class="card stat-card">
            <h3>🔴 Diabetic Cases</h3>
            <h2 id="diabetic-count">0</h2>
        </div>

        <div class="card stat-card">
            <h3>🟢 Healthy Cases</h3>
            <h2 id="healthy-count">0</h2>
        </div>

        <div class="card stat-card">
            <h3>⚡ System Status</h3>
            <h2>✅ Active</h2>
        </div>

    </div>

    <!-- Prediction Form -->

    <div class="card">

        <h2>🧠 Diabetes Prediction</h2>

        <input
            id="pregnancies"
            type="number"
            placeholder="Pregnancies"
        >

        <input
            id="glucose"
            type="number"
            placeholder="Glucose"
        >

        <input
            id="blood_pressure"
            type="number"
            placeholder="Blood Pressure"
        >

        <input
            id="skin_thickness"
            type="number"
            placeholder="Skin Thickness"
        >

        <input
            id="insulin"
            type="number"
            placeholder="Insulin"
        >

        <input
            id="bmi"
            type="number"
            placeholder="BMI"
        >

        <input
            id="dpf"
            type="number"
            step="0.01"
            placeholder="Diabetes Pedigree Function"
        >

        <input
            id="age"
            type="number"
            placeholder="Age"
        >

        <button id="predict-btn">
            Predict Now
        </button>

        <div id="result-card">

            <h2 id="result">

            </h2>

            <p id="recommendation">

            </p>

        </div>

    </div>

    <!-- Analytics Placeholder -->

    <div class="card">

        <h2>📈 Analytics Dashboard</h2>

        <canvas id="predictionChart"></canvas>

    </div>

    <!-- History -->

    <div class="card">

        <h2>📜 Prediction History</h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Glucose</th>

                    <th>Result</th>

                </tr>

            </thead>

            <tbody id="history-body">

            </tbody>

        </table>

    </div>

</div>

<script>

const username =
    localStorage.getItem(
        "username"
    );

if (username) {

    document.getElementById(
        "welcome-user"
    ).innerText =
        `Welcome ${username} 👋`;

}

function logout() {

    localStorage.clear();

    window.location.href =
        "/login";
}

</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="/static/script.js"></script>


</body>
</html>
